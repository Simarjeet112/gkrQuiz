services:
  - type: web
    name: geekroom-code-arena-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 5001
      - key: SQLITE_PATH
        value: ./data/geekroom_arena.db
